services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tastecraft
      POSTGRES_USER: tastecraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tastecraft_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tastecraft"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - vault_data:/app/data/vaults
      - browser_profiles:/app/data/browser_profiles
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://tastecraft:tastecraft_dev@postgres:5432/tastecraft
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TIKHUB_API_KEY=${TIKHUB_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - APP_ENV=development
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  vault_data:
  browser_profiles:
